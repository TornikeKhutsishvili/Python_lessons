<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Register form for IT Field website. HTML, CSS, Bootstrap project" />
    <meta name="keywords"
        content="IT,  programming, cybersecurity, cloud, Information Technology, Web Development,
                HTML, CSS, Bootstrap, Registration"
    />
    <meta name="author" content="Tornike Khutsishvili" />

    <!-- import CDN links -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    />

    <!-- Main Style CSS link -->
    <link rel="stylesheet" href="style.css" />

    <!-- Title -->
    <title>IT Field - Register Form</title>
</head>

<body class="bg-light min-vh-100 d-flex flex-column">
    <!-- Header -->
    <header id="#home">
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container">
                <!-- Navbar brand -->
                <a class="navbar-brand fw-bold" href="index.html">IT Field</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#registerNav"
                    aria-controls="registerNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navbar links -->
                <div class="collapse navbar-collapse" id="registerNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#tracks">
                                Tracks
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#learning">
                                Learning
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="registerForm.html">
                                Register
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <!-- End Header -->


    <!-- Main Content -->
    <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <!-- text content -->
                        <h1 class="h3 text-center mb-2">Join IT Field</h1>
                        <p class="text-secondary text-center mb-4">
                            Complete the form to join our next learning cohort.
                        </p>

                        <!-- Registration Form -->
                        <form>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required />
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    aria-describedby="emailHelp"
                                    placeholder="name@example.com"
                                    required
                                />
                                <div id="emailHelp" class="form-text">
                                    We'll never share your email with anyone else.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="track" class="form-label">Preferred Track</label>
                                <select class="form-select" id="track" required>
                                    <option value="default" selected disabled>Choose one track</option>
                                    <option>Frontend Development</option>
                                    <option>Cybersecurity</option>
                                    <option>Cloud Engineering</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required />
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="agreeTerms" required />
                                <label class="form-check-label" for="agreeTerms">
                                    I agree to the terms and conditions
                                </label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Submit</button>
                                <a href="index.html" class="btn btn-outline-secondary">Back to Home</a>
                            </div>
                        </form>
                        <!-- end form -->
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- End Main -->


    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 TK. All rights reserved.</p>
    </footer>
    <!-- End Footer -->



    <!-- Scripts -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>
</body>

</html>
